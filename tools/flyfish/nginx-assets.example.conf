# Include inside the HTTPS OpenList server block. These are public build assets,
# not application data. Keep all file/download/share routes proxied to OpenList.
location ^~ /file-viewer/ {
    include /etc/nginx/snippets/flyfish-preview-mime.types;
    alias /srv/openlist/web/file-viewer/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}

location ~ ^/(api|d|p|sd|ae|ad|dav)(/|$) {
    proxy_pass http://127.0.0.1:5244;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    client_max_body_size 20000m;
}

location ^~ /flyfish/ {
    include /etc/nginx/snippets/flyfish-preview-mime.types;
    alias /srv/openlist/web/flyfish/;
    autoindex off;
    add_header Cache-Control "public, no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}
